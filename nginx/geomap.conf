# =============================================================================
# /etc/nginx/sites-available/geomap.conf
# Geomap Platform — Self-Signed SSL Reverse Proxy
# =============================================================================

# ── Frontend (React SPA) — Port 4170 ──────────────────────────────
server {
    listen 4170 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/geomap-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/geomap-selfsigned.key;

    location / {
        proxy_pass http://127.0.0.1:14170;
        include proxy_params;
    }
}

# ── API Gateway — Port 3000 ────────────────────────────────────────
server {
    listen 3000 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/geomap-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/geomap-selfsigned.key;

    location / {
        proxy_pass http://127.0.0.1:13000;
        include proxy_params;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
    }
}
