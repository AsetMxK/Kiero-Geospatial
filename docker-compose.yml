# =============================================================================
# Geo Map — Production Docker Compose
#
# 3 services: Gateway, Backend, Frontend
# Network-isolated with frontend (bridge) + backend (internal) segmentation.
# =============================================================================

services:
  # ─── Service 1: Geo Gateway ──────────────────────────────────────────
  gateway:
    build: ./geo-gateway
    container_name: geo-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-13000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      # Database Connection
      - DATABASE_URL=${GATEWAY_DATABASE_URL}
      # URL Identifiers
      - GATEWAY_URL=${GATEWAY_URL:-http://localhost:3000}
      - RESOURCE_SERVER_URL=${RESOURCE_SERVER_URL:-http://backend:3001}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      # Keys
      - GATEWAY_PRIVATE_KEY_PATH=/app/keys/gateway_private.pem
      - GATEWAY_PUBLIC_KEY_PATH=/app/keys/gateway_public.pem
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 192M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Service 2: Backend ──────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: geo-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${BACKEND_DATABASE_URL}
      - GATEWAY_ISSUER_URL=${GATEWAY_URL:-http://localhost:3000}
      - GATEWAY_PUBLIC_KEY_PATH=/app/keys/gateway_public.pem
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Service 3: Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
      - VITE_CLIENT_ID=${VITE_CLIENT_ID}
      - VITE_GATEWAY_URL=${GATEWAY_URL:-http://localhost:3000}
      - VITE_APP_BASE_URL=${VITE_APP_BASE_URL}
    container_name: geo-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-14170}:4170"
    depends_on:
      gateway:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4170/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─── Networks ─────────────────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true