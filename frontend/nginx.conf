# =============================================================================
# Container Nginx — Static Files Only
# SSL termination & API reverse proxy handled by Host Nginx Global
# =============================================================================
server {
    listen 4170;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Routing — React Router handles client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache: Images & Media (1 month)
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Cache: Bundled Code (1 year — Vite hashes filenames)
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}